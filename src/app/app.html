<h1>
  @if (noisy()) {
    {{ title().toUpperCase() + '!!' }}
  } @else {
    {{ title().toLowerCase() }}
  }
</h1>

<button (click)="noisy.update((n) => !n)">
  Make title {{ noisy() ? 'quiet' : 'noisy' }}
</button>

<nav>
  <ul>
    <li><a [routerLink]="['dashboard']">Go to Dashboard</a></li>
    <li><a [routerLink]="['about']">About This App</a></li>
    <li><a routerLink="help">Help</a></li>
  </ul>
</nav>

<router-outlet />
