<h3>Video List</h3>

@for (video of videos(); track video.id) {
  <button
    (click)="updateCurrentVideo(video)"
    [class.highlighted]="video === currentVideo()"
  >
    <img
      alt="Pretty picture"
      [src]="'http://img.youtube.com/vi/' + video.id + '/0.jpg'"
    />

    {{ video.title }}<br />
    {{ video.author }}
  </button>
} @empty {
  No videos to show!
}
