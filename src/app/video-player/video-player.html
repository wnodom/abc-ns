<h3>Video Player</h3>

@if (video(); as v) {
  <iframe
    width="560"
    height="315"
    [src]="trustedYouTubeUrl()"
    title="YouTube video player"
    frameborder="0"
    allow="
      accelerometer;
      autoplay;
      clipboard-write;
      encrypted-media;
      gyroscope;
      picture-in-picture;
      web-share;
    "
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
  ></iframe>

  <p>{{ v.title }}</p>
}
